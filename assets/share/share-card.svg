<?xml version="1.0" encoding="UTF-8"?>
<!--
  The link-preview card (Open Graph, 1200 x 630). This is the source; `npm run render:share`
  turns it into public/og-image.png. It links the real fonts and Viper sprite, so open it in a
  browser (not an image viewer) to see it as it renders. Colors are the tokens in styles.css.
  Keep the words inside the middle ~1000 px: some apps crop the sides.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630">
  <style>
    @font-face { font-family: 'VT323'; src: url('../fonts/vt323-latin-400-normal.woff2') format('woff2'); }
    @font-face { font-family: 'Atkinson Hyperlegible'; src: url('../fonts/atkinson-hyperlegible-latin-400-normal.woff2') format('woff2'); }
    .display { font-family: 'VT323', monospace; }
    .readable { font-family: 'Atkinson Hyperlegible', sans-serif; }
  </style>
  <defs>
    <radialGradient id="glow" cx="330" cy="315" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#06110c" />
      <stop offset="1" stop-color="#05070a" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Dradis: range rings and a crosshair centered on the Viper. -->
  <g fill="none" stroke="#2c4a3a" stroke-width="2">
    <circle cx="330" cy="315" r="130" />
    <circle cx="330" cy="315" r="215" />
    <circle cx="330" cy="315" r="300" />
    <circle cx="330" cy="315" r="385" stroke-dasharray="6 10" />
    <line x1="330" y1="0" x2="330" y2="630" stroke-dasharray="6 10" />
    <line x1="0" y1="315" x2="700" y2="315" stroke-dasharray="6 10" />
  </g>

  <!-- Contacts on the scope. -->
  <g fill="#ffc457">
    <rect x="520" y="120" width="10" height="10" />
    <rect x="120" y="470" width="10" height="10" />
    <rect x="600" y="455" width="10" height="10" />
  </g>

  <!-- The Viper, 64 px sprite at 6x. Nearest-neighbor scaling keeps the pixels square. -->
  <image href="../ships/viper_neutral.png" xlink:href="../ships/viper_neutral.png"
         x="138" y="123" width="384" height="384" image-rendering="pixelated"
         style="image-rendering: pixelated" />

  <!-- Wordmark. -->
  <text class="display" x="660" y="268" font-size="260" fill="#ffc457">33</text>
  <text class="display" x="664" y="370" font-size="132" fill="#b8ffdc" letter-spacing="6">Seconds</text>

  <text class="readable" font-size="30" fill="#cfe8d8">
    <tspan x="666" y="430">Every thirty-three seconds,</tspan>
    <tspan x="666" y="470">the fleet jumps.</tspan>
    <tspan x="666" y="510">Keep them alive.</tspan>
  </text>

  <text class="display" x="666" y="570" font-size="34" fill="#9fb8ab" letter-spacing="3">UNOFFICIAL FAN GAME · FREE</text>

  <!-- Corner brackets, as on the title board. -->
  <g fill="none" stroke="#1c8459" stroke-width="4">
    <path d="M24 64 V24 H64" />
    <path d="M1136 24 H1176 V64" />
    <path d="M24 566 V606 H64" />
    <path d="M1176 566 V606 H1136" />
  </g>
</svg>
